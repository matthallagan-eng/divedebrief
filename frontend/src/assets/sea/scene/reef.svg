<!-- reef: stretched across the bottom of the screen; the .sea-grass group sways -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="170" viewBox="0 0 1440 170" preserveAspectRatio="xMidYMax slice">
  <style>
    .sea-grass { transform-origin: bottom; transform-box: fill-box; animation: grass 7s ease-in-out infinite alternate; }
    @keyframes grass { from { transform: skewX(-4deg); } to { transform: skewX(4deg); } }
    @media (prefers-reduced-motion: reduce) { .sea-grass { animation: none; } }
  </style>
